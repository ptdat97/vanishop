name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci

      - name: Clean-room check
        run: ./scripts/ci/clean-room-check.sh

      - name: License check (PHP production deps)
        run: composer licenses --no-dev --format=json | php scripts/ci/license-check.php

      - name: Pint
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan, level 5 + baseline)
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress

      - name: Security advisories (composer audit)
        run: composer audit --no-dev

      - name: Type check (Vue/TS)
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Build assets
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: vanishop_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate

      - name: Tests (SQLite in-memory)
        run: vendor/bin/pest --compact

      - name: Type coverage (≥ 97%)
        run: vendor/bin/pest --type-coverage --min=97

      - name: Tests (MySQL 8.4)
        run: vendor/bin/pest --compact
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: vanishop_testing
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Concurrency tests — không oversell, không deadlock (MySQL 8.4, nhiều tiến trình)
        run: vendor/bin/pest --compact --group=concurrency
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: vanishop_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
